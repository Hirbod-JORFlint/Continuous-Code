[hooks]
PostToolUse = [{command = "uv run $HOME/.opc/hooks/hook_launcher.py typescript-preflight", matcher = "Edit|Write", timeout = 40, type = "command"}, {command = "uv run $HOME/.opc/hooks/hook_launcher.py compiler-in-the-loop", matcher = "Edit|Write", timeout = 30, type = "command"}, {command = "uv run $HOME/.opc/hooks/hook_launcher.py post-edit-notify", matcher = "Edit|Write", timeout = 5, type = "command"}, {command = "uv run $HOME/.opc/hooks/hook_launcher.py post-edit-diagnostics", matcher = "Edit|Write", timeout = 10, type = "command"}, {command = "uv run $HOME/.opc/hooks/hook_launcher.py handoff-index", matcher = "Write", type = "command"}, {command = "uv run $HOME/.opc/hooks/hook_launcher.py post-tool-use-tracker", matcher = "Edit|MultiEdit|Write|Bash", timeout = 120, type = "command"}, {command = "uv run $HOME/.opc/hooks/hook_launcher.py braintrust-post-tool-use", matcher = "*", type = "command"}, {command = "uv run $HOME/.opc/hooks/hook_launcher.py import-validator", matcher = "Edit|Write", timeout = 5, type = "command"}, {command = "uv run $HOME/.opc/hooks/hook_launcher.py import-error-detector", matcher = "Bash", timeout = 5, type = "command"}]
PreCompact = [{command = "uv run $HOME/.opc/hooks/hook_launcher.py pre-compact-continuity", type = "command"}]
PreToolUse = [{command = "uv run $HOME/.opc/hooks/hook_launcher.py pre-tool-use-broadcast", type = "command"}, {command = "uv run $HOME/.opc/hooks/hook_launcher.py path-rules", matcher = "Read|Edit|Write", timeout = 5, type = "command"}, {command = "uv run $HOME/.opc/hooks/hook_launcher.py tldr-read-enforcer", matcher = "Read", timeout = 20, type = "command"}, {command = "uv run $HOME/.opc/hooks/hook_launcher.py smart-search-router", matcher = "Grep", timeout = 10, type = "command"}, {command = "uv run $HOME/.opc/hooks/hook_launcher.py tldr-context-inject", matcher = "Task", timeout = 30, type = "command"}, {command = "uv run $HOME/.opc/hooks/hook_launcher.py arch-context-inject", matcher = "Task", timeout = 30, type = "command"}, {command = "uv run $HOME/.opc/hooks/hook_launcher.py file-claims", matcher = "Edit", timeout = 5, type = "command"}, {command = "uv run $HOME/.opc/hooks/hook_launcher.py edit-context-inject", matcher = "Edit", timeout = 5, type = "command"}, {command = "uv run $HOME/.opc/hooks/hook_launcher.py signature-helper", matcher = "Edit", timeout = 5, type = "command"}]
SessionEnd = [{command = "uv run $HOME/.opc/hooks/hook_launcher.py session-end-cleanup", type = "command"}, {command = "uv run $HOME/.opc/hooks/hook_launcher.py session-outcome", type = "command"}, {command = "uv run $HOME/.opc/hooks/hook_launcher.py braintrust-session-end", type = "command"}]
SessionStart = [{command = "uv run $HOME/.opc/hooks/hook_launcher.py persist-project-dir", type = "command"}, {command = "uv run $HOME/.opc/hooks/hook_launcher.py braintrust-session-start", type = "command"}, {command = "uv run $HOME/.opc/hooks/hook_launcher.py session-register", timeout = 10, type = "command"}, {command = "uv run $HOME/.opc/hooks/hook_launcher.py session-symbol-index", timeout = 5, type = "command"}, {command = "uv run $HOME/.opc/hooks/hook_launcher.py session-start-continuity", matcher = "resume|compact|clear", type = "command"}, {command = "uv run $HOME/.opc/hooks/hook_launcher.py session-start-tldr-cache", matcher = "startup|resume", timeout = 2, type = "command"}]
Stop = [{command = "uv run $HOME/.opc/hooks/hook_launcher.py auto-handoff-stop", type = "command"}, {command = "uv run $HOME/.opc/hooks/hook_launcher.py braintrust-stop", type = "command"}, {command = "uv run $HOME/.opc/hooks/hook_launcher.py compiler-in-the-loop-stop", type = "command"}]
UserPromptSubmit = [{command = "uv run $HOME/.opc/hooks/hook_launcher.py skill-activation-prompt", type = "command"}, {command = "uv run $HOME/.opc/hooks/hook_launcher.py premortem-suggest", timeout = 5, type = "command"}, {command = "uv run $HOME/.opc/hooks/hook_launcher.py memory-awareness", timeout = 10, type = "command"}, {command = "uv run $HOME/.opc/hooks/hook_launcher.py impact-refactor", timeout = 10, type = "command"}, {command = "uv run $HOME/.opc/hooks/hook_launcher.py braintrust-user-prompt-submit", type = "command"}]

[mcp_servers.ast-grep]
args = ["-y", "@anthropic/mcp-ast-grep"]
command = "npx"
enabled = false

[mcp_servers.fetch]
args = ["mcp-server-fetch"]
command = "uvx"
enabled = true

[mcp_servers.firecrawl]
args = ["-y", "firecrawl-mcp"]
command = "npx"
enabled = false
[mcp_servers.firecrawl.env]
FIRECRAWL_API_KEY = "${FIRECRAWL_API_KEY}"


[mcp_servers.git]
args = ["mcp-server-git", "--repository", "."]
command = "uvx"
enabled = true

[mcp_servers.github]
enabled = false
url = "https://api.githubcopilot.com/mcp/"
[mcp_servers.github.http_headers]
Authorization = "Bearer ${GITHUB_PERSONAL_ACCESS_TOKEN}"


[mcp_servers.morph]
args = ["-y", "@morphllm/morphmcp"]
command = "npx"
enabled = false
[mcp_servers.morph.env]
MORPH_API_KEY = "${MORPH_API_KEY}"


[mcp_servers.nia]
args = ["run", "--no-cache", "nia-mcp-server"]
command = "pipx"
enabled = false
[mcp_servers.nia.env]
NIA_API_KEY = "${NIA_API_KEY}"
NIA_API_URL = "https://apigcp.trynia.ai/"


[mcp_servers.perplexity]
args = ["-y", "@perplexity-ai/mcp-server"]
command = "npx"
enabled = false
[mcp_servers.perplexity.env]
PERPLEXITY_API_KEY = "${PERPLEXITY_API_KEY}"


[mcp_servers.qlty]
args = ["$HOME/.claude/servers/qlty/server.py"]
command = "$HOME/.claude/venv/bin/python"
enabled = true

[mcp_servers.repoprompt]
command = "repoprompt_cli"
enabled = false
