# Neutral lifecycle hook manifest — source of truth for event wiring.
#
# Generators translate this into driver configs:
#   - gen_codex.py    -> ~/.codex/config.toml hooks
#   - gen_opencode.py -> .opencode/plugins/opc-hooks.ts; opencode has NO
#     config-level hooks key, so hooks surface as an auto-loaded plugin.
#   - gen_cline.py    -> .clinerules/hooks/ executable hooks (macOS/Linux
#     extensionless, Windows *.ps1).
#
# Schema: each event under [hooks.*] is an array of handler tables. Handler
# keys consumed by gen_codex: command, matcher, statusMessage, timeout, async,
# additionalContextLimit, disabled. Extra keys (id, description, transport)
# are metadata — ignored by the codex emitter, read by gen_opencode/gen_cline.
#
# Transport notes:
#   - Re-homed python hooks run through the canonical launcher:
#     `uv run $HOME/.opc/hooks/hook_launcher.py <name>` where ~/.opc/hooks is
#     the neutral install root (junction -> harness/lifecycle/hooks today,
#     copied by the Step 9 installer on other machines).
#   - All hook handlers now run through the neutral launcher above.

[meta]
version = 1
install_root = "$HOME/.opc/hooks"
canonical_hooks_dir = "harness/lifecycle/hooks"
python_transport = "uv run $HOME/.opc/hooks/hook_launcher.py <name>"

[[hooks.session_start]]
id = "persist-project-dir"
description = "Persist project dir for OPC_* env propagation"
command = "uv run $HOME/.opc/hooks/hook_launcher.py persist-project-dir"

[[hooks.session_start]]
id = "braintrust-session-start"
description = "Open session for Braintrust tracing"
command = "uv run $HOME/.opc/hooks/hook_launcher.py braintrust-session-start"

[[hooks.session_start]]
id = "session-register"
description = "Register session in OPC registry"
command = "uv run $HOME/.opc/hooks/hook_launcher.py session-register"
timeout = 10

[[hooks.session_start]]
id = "session-symbol-index"
description = "Warm tldr cache and build semantic index"
command = "uv run $HOME/.opc/hooks/hook_launcher.py session-symbol-index"
timeout = 5

[[hooks.session_start]]
id = "session-start-continuity"
description = "Restore continuity ledger context on resume/compact/clear"
matcher = "resume|compact|clear"
command = "uv run $HOME/.opc/hooks/hook_launcher.py session-start-continuity"

[[hooks.session_start]]
id = "session-start-tldr-cache"
description = "Pre-warm tldr cache on startup/resume"
matcher = "startup|resume"
command = "uv run $HOME/.opc/hooks/hook_launcher.py session-start-tldr-cache"
timeout = 2

[[hooks.prompt_submit]]
id = "skill-activation-prompt"
description = "Activate relevant skills for the prompt"
command = "uv run $HOME/.opc/hooks/hook_launcher.py skill-activation-prompt"

[[hooks.prompt_submit]]
id = "premortem-suggest"
description = "Suggest /premortem deep <plan> when implementing from a plan"
command = "uv run $HOME/.opc/hooks/hook_launcher.py premortem-suggest"
timeout = 5

[[hooks.prompt_submit]]
id = "memory-awareness"
description = "Inject memory-system awareness into the prompt"
command = "uv run $HOME/.opc/hooks/hook_launcher.py memory-awareness"
timeout = 10

[[hooks.prompt_submit]]
id = "impact-refactor"
description = "Flag refactor-ready code paths mentioned in the prompt"
command = "uv run $HOME/.opc/hooks/hook_launcher.py impact-refactor"
timeout = 10

[[hooks.prompt_submit]]
id = "braintrust-user-prompt-submit"
description = "Record prompt for Braintrust tracing"
command = "uv run $HOME/.opc/hooks/hook_launcher.py braintrust-user-prompt-submit"

[[hooks.pre_tool_use]]
id = "pre-tool-use-broadcast"
description = "Broadcast tool-use to observers (no blocking)"
command = "uv run $HOME/.opc/hooks/hook_launcher.py pre-tool-use-broadcast"

[[hooks.pre_tool_use]]
id = "path-rules"
description = "Enforce path allow/deny rules before file ops"
matcher = "Read|Edit|Write"
command = "uv run $HOME/.opc/hooks/hook_launcher.py path-rules"
timeout = 5

[[hooks.pre_tool_use]]
id = "tldr-read-enforcer"
description = "Route reads of indexed files through tldr cache"
matcher = "Read"
command = "uv run $HOME/.opc/hooks/hook_launcher.py tldr-read-enforcer"
timeout = 20

[[hooks.pre_tool_use]]
id = "smart-search-router"
description = "Route searches to the best search tool"
matcher = "Grep"
command = "uv run $HOME/.opc/hooks/hook_launcher.py smart-search-router"
timeout = 10

[[hooks.pre_tool_use]]
id = "tldr-context-inject"
description = "Inject tldr context for Task/delegated work"
matcher = "Task"
command = "uv run $HOME/.opc/hooks/hook_launcher.py tldr-context-inject"
timeout = 30

[[hooks.pre_tool_use]]
id = "arch-context-inject"
description = "Inject architecture context for Task/delegated work"
matcher = "Task"
command = "uv run $HOME/.opc/hooks/hook_launcher.py arch-context-inject"
timeout = 30

[[hooks.pre_tool_use]]
id = "file-claims"
description = "Record file ownership claims before edits"
matcher = "Edit"
command = "uv run $HOME/.opc/hooks/hook_launcher.py file-claims"
timeout = 5

[[hooks.pre_tool_use]]
id = "edit-context-inject"
description = "Inject symbol/file context before edits"
matcher = "Edit"
command = "uv run $HOME/.opc/hooks/hook_launcher.py edit-context-inject"
timeout = 5

[[hooks.pre_tool_use]]
id = "signature-helper"
description = "Surface signatures before edits"
matcher = "Edit"
command = "uv run $HOME/.opc/hooks/hook_launcher.py signature-helper"
timeout = 5

[[hooks.post_tool_use]]
id = "typescript-preflight"
description = "Run TypeScript typecheck preflight after edits"
matcher = "Edit|Write"
command = "uv run $HOME/.opc/hooks/hook_launcher.py typescript-preflight"
timeout = 40

[[hooks.post_tool_use]]
id = "compiler-in-the-loop"
description = "Compile edited modules and surface diagnostics"
matcher = "Edit|Write"
command = "uv run $HOME/.opc/hooks/hook_launcher.py compiler-in-the-loop"
timeout = 30

[[hooks.post_tool_use]]
id = "post-edit-notify"
description = "Notify on edit completion"
matcher = "Edit|Write"
command = "uv run $HOME/.opc/hooks/hook_launcher.py post-edit-notify"
timeout = 5

[[hooks.post_tool_use]]
id = "post-edit-diagnostics"
description = "Collect diagnostics after edits"
matcher = "Edit|Write"
command = "uv run $HOME/.opc/hooks/hook_launcher.py post-edit-diagnostics"
timeout = 10

[[hooks.post_tool_use]]
id = "handoff-index"
description = "Index handoff docs written this session"
matcher = "Write"
command = "uv run $HOME/.opc/hooks/hook_launcher.py handoff-index"

[[hooks.post_tool_use]]
id = "post-tool-use-tracker"
description = "Track edited files + build/test attempts for reasoning VCS"
matcher = "Edit|MultiEdit|Write|Bash"
command = "uv run $HOME/.opc/hooks/hook_launcher.py post-tool-use-tracker"
timeout = 120

[[hooks.post_tool_use]]
id = "braintrust-post-tool-use"
description = "Record tool use for Braintrust tracing"
matcher = "*"
command = "uv run $HOME/.opc/hooks/hook_launcher.py braintrust-post-tool-use"

[[hooks.post_tool_use]]
id = "import-validator"
description = "Validate imports after edits"
matcher = "Edit|Write"
command = "uv run $HOME/.opc/hooks/hook_launcher.py import-validator"
timeout = 5

[[hooks.post_tool_use]]
id = "import-error-detector"
description = "Detect import errors in bash output"
matcher = "Bash"
command = "uv run $HOME/.opc/hooks/hook_launcher.py import-error-detector"
timeout = 5

[[hooks.pre_compact]]
id = "pre-compact-continuity"
description = "Persist continuity ledger excerpt before context compaction"
command = "uv run $HOME/.opc/hooks/hook_launcher.py pre-compact-continuity"

[[hooks.stop]]
id = "auto-handoff-stop"
description = "Block stop when context too high and suggest handoff"
command = "uv run $HOME/.opc/hooks/hook_launcher.py auto-handoff-stop"

[[hooks.stop]]
id = "braintrust-stop"
description = "Record stop for Braintrust tracing"
command = "uv run $HOME/.opc/hooks/hook_launcher.py braintrust-stop"

[[hooks.stop]]
id = "compiler-in-the-loop-stop"
description = "Final compile sweep before the session stops"
command = "uv run $HOME/.opc/hooks/hook_launcher.py compiler-in-the-loop-stop"

[[hooks.session_stop]]
id = "session-end-cleanup"
description = "Clean up session artifacts"
command = "uv run $HOME/.opc/hooks/hook_launcher.py session-end-cleanup"

[[hooks.session_stop]]
id = "session-outcome"
description = "Record session outcome"
command = "uv run $HOME/.opc/hooks/hook_launcher.py session-outcome"

[[hooks.session_stop]]
id = "braintrust-session-end"
description = "Close session for Braintrust tracing"
command = "uv run $HOME/.opc/hooks/hook_launcher.py braintrust-session-end"